<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LendEarnWorld</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<nav class="navbar">

    <div class="container">

        <a href="index.html" class="logo">
            <span class="logo-dot"></span>
            LendEarnWorld
        </a>

        <div class="nav-actions">

            <a href="login.html" class="login-btn">
                Login
            </a>

        </div>

    </div>

</nav>

<section class="auth-page">

    <div class="auth-card register-card">

        <h1>Create Account</h1>

        <p>
            Join LendEarnWorld and begin your lending journey.
        </p>

        <form action="dashboard.html">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="johndoe" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@email.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+1 555 123 4567" required>
            </div>

            <div class="form-group">
                <label>Country</label>
                <select required>

                    <option value="">Select Country</option>

                    <option>United States</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                    <option>Australia</option>
                    <option>Kenya</option>
                    <option>Nigeria</option>
                    <option>South Africa</option>

                </select>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" required>
            </div>

            <label class="terms">

                <input type="checkbox" required>

                I agree to the Terms & Conditions.

            </label>

            <button class="auth-btn">
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</section>

</body>
</html>
