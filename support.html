<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LendEarnWorld</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="logo">
            <span class="logo-dot"></span>
            LendEarnWorld
        </a>

        <div class="nav-actions">
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </div>
</nav>

<section class="auth-page">
    <div class="auth-card register-card">

        <h1>Create Account</h1>

        <p>Join LendEarnWorld and begin your journey with us.</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                    placeholder="Choose a username"
                    autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email address"
                    autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="country">Country of Residence</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="Select your country first"
                    autocomplete="tel" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="8" required>
            </div>

            <!-- Internal currency field. Not visible to the user. -->
            <input type="hidden" id="depositCurrency"
                name="depositCurrency" value="">

            <label class="terms">
                <input type="checkbox" name="terms" required>
                I agree to the Terms & Conditions.
            </label>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>
</section>

// ==========================================
// GET FORM ELEMENTS
// ==========================================

const registerForm = document.getElementById("registerForm");
const countrySelect = document.getElementById("country");
const phoneInput = document.getElementById("phone");
const currencyInput = document.getElementById("depositCurrency");

let currentDialCode = "";


// ==========================================
// POPULATE COUNTRY DROPDOWN
// ==========================================

countries.forEach(function(country) {
    const option = document.createElement("option");

    option.value = country[1];
    option.textContent = country[0];

    option.dataset.currency = country[2];
    option.dataset.dialCode = country[3];
    option.dataset.countryName = country[0];

    countrySelect.appendChild(option);
});


// ==========================================
// UPDATE PHONE CODE AND CURRENCY
// ==========================================

countrySelect.addEventListener("change", function() {
    const selectedOption = this.options[this.selectedIndex];

    currentDialCode = selectedOption.dataset.dialCode || "";
    const currency = selectedOption.dataset.currency || "";

    currencyInput.value = currency;

    phoneInput.value = currentDialCode
        ? currentDialCode + " "
        : "";

    phoneInput.placeholder = currentDialCode
        ? "Enter your phone number"
        : "Select your country first";
});


// ==========================================
// KEEP COUNTRY CODE WHEN USER TYPES
// ==========================================

phoneInput.addEventListener("input", function() {
    if (!currentDialCode) return;

    if (!phoneInput.value.startsWith(currentDialCode)) {
        const digits = phoneInput.value.replace(/\D/g, "");
        const codeDigits = currentDialCode.replace(/\D/g, "");

        const numberDigits = digits.startsWith(codeDigits)
            ? digits.slice(codeDigits.length)
            : digits;

        phoneInput.value = currentDialCode + " " + numberDigits;
    }
});


// ==========================================
// REGISTER AND SAVE USER PROFILE
// ==========================================

registerForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = phoneInput.value.trim();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const countryCode = countrySelect.value;
    const selectedOption = countrySelect.options[countrySelect.selectedIndex];

    const currency = selectedOption.dataset.currency || "";
    const dialCode = selectedOption.dataset.dialCode || "";
    const countryName = selectedOption.dataset.countryName || "";

    // Check required country information
    if (!countryCode || !currency || !dialCode) {
        alert("Please select your country.");
        return;
    }

    // Check password length
    if (password.length < 8) {
        alert("Your password must contain at least 8 characters.");
        return;
    }

    // Check password confirmation
    if (password !== confirmPassword) {
        alert("Your passwords do not match.");
        return;
    }

    // Check phone number
    const phoneDigits = phone.replace(/\D/g, "");
    const dialDigits = dialCode.replace(/\D/g, "");

    if (!phoneDigits.startsWith(dialDigits) ||
        phoneDigits.length <= dialDigits.length) {
        alert("Please enter a valid phone number.");
        phoneInput.focus();
        return;
    }

    // Save user profile information.
    // Passwords are deliberately NOT saved.

    const profile = {
        fullName: fullName,
        username: username,
        email: email,
        phone: phone,
        country: countryCode,
        countryName: countryName,
        currency: currency,
        phoneCode: dialCode
    };

    try {
        localStorage.setItem("lewProfile", JSON.stringify(profile));

        // Keep these separate keys for the other website pages.
        localStorage.setItem("lewCountry", countryCode);
        localStorage.setItem("lewDepositCurrency", currency);
        localStorage.setItem("lewPhoneCode", dialCode);

        // Continue to the dashboard.
        window.location.href = "dashboard.html";

    } catch (error) {
        alert("Your information could not be saved in this browser. Please check your browser storage settings.");
        console.error("Registration storage error:", error);
    }
});
