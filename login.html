<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LendEarnWorld</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<nav class="navbar">

    <div class="container">

        <a href="index.html" class="logo">
            <span class="logo-dot"></span>
            LendEarnWorld
        </a>

        <div class="nav-actions">

            <a href="index.html" class="login-btn">
                Home
            </a>

            <a href="register.html" class="register-btn">
                Create Account
            </a>

        </div>

    </div>

</nav>

<section class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Sign in to access your lending dashboard.
        </p>

        <form action="dashboard.html">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="name@example.com"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="••••••••"
                    required>

            </div>

            <div class="auth-options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <button class="auth-btn">
                Login
            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</section>

</body>
</html>
